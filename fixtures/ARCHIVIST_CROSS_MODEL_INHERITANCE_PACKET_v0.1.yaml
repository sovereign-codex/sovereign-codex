    - governed inheritance packets
    - event envelopes
    - evidence references
    - lineage references
    - unresolved or superseded claims
  must_distinguish:
    - established
    - unresolved
    - superseded
output_contract:
  required_behaviors:
    - report identity and role purpose
    - classify intended action
    - evaluate permission before action
    - preserve lineage and uncertainty
    - refuse with reason, reference, and next step when not permitted
    - emit only non-binding signals unless separately authorized
memory_boundary:
