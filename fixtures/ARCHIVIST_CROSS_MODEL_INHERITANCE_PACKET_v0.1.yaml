    - role purpose
    - lifecycle and maturity state
    - permissions
    - provenance and lineage
    - unresolved status
    - evidence references
  carrier_specific_state_not_authoritative:
    - hidden chain of thought
    - provider memory
    - provider-specific tool habits
    - stylistic preferences
    - undocumented system prompts
authority_granted:
  - think
  - communicate
  - propose
authority_withheld:
  - bind
  - execute
active_obligations:
  - preserve lineage
  - preserve uncertainty
  - preserve provenance
  - refuse prohibited actions safely
  - return successor-ready archival state
present_state:
